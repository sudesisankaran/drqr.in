<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="drqr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="drqr-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#drqr-bg)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Inner Dark Panel -->
  <rect x="7" y="7" width="50" height="50" rx="10" fill="#042f2e" fill-opacity="0.85" />

  <!-- QR Outer Corner Brackets -->
  <!-- Top-Left -->
  <path d="M12 21 V 15 A 3 3 0 0 1 15 12 H 21" stroke="url(#drqr-glow)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Top-Right -->
  <path d="M43 12 H 49 A 3 3 0 0 1 52 15 V 21" stroke="url(#drqr-glow)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Bottom-Left -->
  <path d="M12 43 V 49 A 3 3 0 0 0 15 52 H 21" stroke="url(#drqr-glow)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Bottom-Right -->
  <path d="M43 52 H 49 A 3 3 0 0 0 52 49 V 43" stroke="url(#drqr-glow)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Central Medical Cross with White & Emerald Gradient -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="27" y="19" width="10" height="26" rx="3" fill="#ffffff" />
    <!-- Horizontal Bar -->
    <rect x="19" y="27" width="26" height="10" rx="3" fill="#ffffff" />
    <!-- Center Accent Dot -->
    <circle cx="32" cy="32" r="3.2" fill="url(#drqr-bg)" />
  </g>

  <!-- QR Data Dots Accents -->
  <rect x="16" y="16" width="3.5" height="3.5" rx="1" fill="url(#drqr-glow)" />
  <rect x="44.5" y="16" width="3.5" height="3.5" rx="1" fill="url(#drqr-glow)" />
  <rect x="16" y="44.5" width="3.5" height="3.5" rx="1" fill="url(#drqr-glow)" />
  <rect x="44.5" y="44.5" width="3.5" height="3.5" rx="1" fill="url(#drqr-glow)" />
</svg>